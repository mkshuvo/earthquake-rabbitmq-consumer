server {
    listen 80;
    listen [::]:80;
    server_name rc.quakenow.ovh;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rc.quakenow.ovh;

    ssl_certificate /etc/letsencrypt/live/quakenow.ovh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quakenow.ovh/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # MQTT WebSocket proxy
    location /mqtt {
        set $ea_emqx "http://ea-emqx:8083";
        proxy_pass $ea_emqx;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # HTTP fallback to the consumer service (health/debug)
    location / {
        set $ea_receiver "http://ea-receiver:7000";
        proxy_pass $ea_receiver;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
